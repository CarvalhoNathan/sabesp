        <text x="1024" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#F87171" text-anchor="middle" font-weight="600">🚨 Prazo Próximo do Limite</text>
