  <rect x="0" y="28" width="1200" height="16" fill="#131C2E" />
  <line x1="0" y1="44" x2="1200" y2="44" stroke="#1E293B" stroke-width="1" />
  
  <circle cx="28" cy="22" r="6" fill="#EF4444" />
  <circle cx="48" cy="22" r="6" fill="#F59E0B" />
  <circle cx="68" cy="22" r="6" fill="#10B981" />
  
  <!-- Address Bar -->
