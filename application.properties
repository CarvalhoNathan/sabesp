spring.application.name=saneamento-chamados
server.port=${PORT:8080}

# Perfil padrão: H2 em memória para testar a interface imediatamente.
# Para usar Supabase em produção/homologação, ative: --spring.profiles.active=supabase
spring.datasource.url=jdbc:h2:mem:santos_saneamento;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Upload de fotos (até 5 fotos de 10 MB cada)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=55MB

# Thymeleaf
spring.thymeleaf.cache=false
